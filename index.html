      <p>
        <strong>DNS.usectl.com</strong> is a zero-bloat, ad-free global DNS propagation verification engine and live nslookup cross-check workstation.
        Verify DNS records across 16+ edge resolvers worldwide in sub-50ms latency.
      </p>

      <h2>Supported DNS Record Types</h2>
      <ul>
        <li><strong>A</strong>: IPv4 host address mapping</li>
        <li><strong>AAAA</strong>: IPv6 128-bit address mapping</li>
        <li><strong>CNAME</strong>: Canonical name alias redirection</li>
        <li><strong>MX</strong>: Mail exchange server routing with priority weights</li>
        <li><strong>TXT</strong>: SPF, DKIM, DMARC validation, and domain verification tokens</li>
        <li><strong>NS</strong>: Authoritative nameserver delegation</li>
        <li><strong>CAA</strong>: Certificate Authority Authorization policy flags</li>
        <li><strong>SOA</strong>: Zone administrative metadata, serial numbers, and expiry timers</li>
        <li><strong>PTR</strong>: Reverse DNS in-addr.arpa lookup</li>
      </ul>

      <h2>CLI nslookup &amp; dig Cheat Sheet</h2>
      <pre><code># Query A record with nslookup

dig +short TXT usectl.com @1.1.1.1</code></pre>
