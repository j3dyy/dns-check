<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dnsFavBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>
    <linearGradient id="radarCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="dnsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="48" height="48" rx="12" fill="url(#dnsFavBg)" />
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />

  <!-- Radar Rings (Concentric Propagation Waves) -->
  <circle cx="24" cy="24" r="17" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.2" stroke-dasharray="2 3" />
  <circle cx="24" cy="24" r="12" stroke="rgba(56, 189, 248, 0.28)" stroke-width="1.2" />
  <circle cx="24" cy="24" r="6" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2" />

  <!-- Radar Crosshairs -->
  <line x1="24" y1="8" x2="24" y2="40" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
  <line x1="8" y1="24" x2="40" y2="24" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />

  <!-- Sweep Arc Gradient -->
  <path d="M24 24 L24 7 A17 17 0 0 1 41 24 Z" fill="url(#radarSweep)" />

  <!-- Global Edge Nodes (Resolved Points) -->
  <g filter="url(#dnsGlow)">
    <!-- Node 1: North America Edge -->
    <circle cx="15" cy="17" r="2.2" fill="#38bdf8" />
    <!-- Node 2: Europe Edge -->
    <circle cx="33" cy="16" r="2.2" fill="#10b981" />
    <!-- Node 3: Asia Pacific Edge -->
    <circle cx="34" cy="31" r="2" fill="#818cf8" />
    <!-- Node 4: South Edge -->
    <circle cx="16" cy="32" r="2" fill="#38bdf8" />

    <!-- Center Pulse Core -->
    <circle cx="24" cy="24" r="3.5" fill="url(#radarCyan)" />
    <circle cx="24" cy="24" r="1.5" fill="#ffffff" />
  </g>
</svg>
